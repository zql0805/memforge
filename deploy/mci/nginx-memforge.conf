# Memforge Nginx 反向代理配置
# Created by dev on 2026/04/28
#
# 安装: sudo cp nginx-memforge.conf /etc/nginx/conf.d/memforge.conf
#        sudo nginx -t && sudo systemctl reload nginx
#
# Web UI 静态文件 + Gateway API 反代

upstream memforge_gateway {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen 8080;
    server_name memforge.example.com;

    root /opt/memforge/packages/web-ui/dist;
    index index.html;

    # 请求体大小（记忆内容可能较大）
    client_max_body_size 10m;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，确保部署后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Vue Router HTML5 History Mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 拓扑扫描 API（长时间运行，最多 15 分钟）
    location /api/topology/scan-remote {
        proxy_pass http://memforge_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 扫描进度 SSE（长连接）
    location /api/topology/scan-progress/ {
        proxy_pass http://memforge_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        chunked_transfer_encoding off;
    }

    # Gateway API 反代
    location /api/ {
        proxy_pass http://memforge_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # OAuth 认证
    location /oauth/ {
        proxy_pass http://memforge_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket 长连接（MCP 客户端注册 + 远程扫描 RPC）
    location /ws/ {
        proxy_pass http://memforge_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # MCP 协议（支持 WebSocket 升级）
    location /mcp {
        proxy_pass http://memforge_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # GitLab Webhook 自动部署（代理到 webhook-deploy 服务）
    location /webhook/ {
        proxy_pass http://127.0.0.1:9876;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Gitlab-Token $http_x_gitlab_token;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }

    # Prometheus 指标
    location /metrics {
        proxy_pass http://memforge_gateway;
        # 可选：限制指标访问来源
        # allow 10.0.0.0/8;
        # deny all;
    }

    # 健康检查（不记日志）
    location /health {
        proxy_pass http://memforge_gateway;
        access_log off;
    }
}
